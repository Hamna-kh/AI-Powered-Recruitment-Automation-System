<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentAI | Apply for a job</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg,#fdf4ff 0%,#f0fdfa 50%,#fff7ed 100%); background-attachment: fixed; min-height: 100vh; }
  .card { background: rgba(255,255,255,.65); border: 1px solid rgba(216,180,254,.4); backdrop-filter: blur(16px); border-radius: 20px; box-shadow: 0 8px 32px rgba(199,165,255,.15); }
  .field { width: 100%; background: rgba(255,255,255,.85); border: 1px solid #ede9fe; border-radius: 12px; padding: 10px 14px; color: #3f3f46; }
  .field:focus { outline: none; border-color: #c4b5fd; }
  .btn { background: linear-gradient(135deg,#c4b5fd,#f9a8d4); color: #fff; font-weight: 700; border-radius: 12px; padding: 12px 22px; width: 100%; }
  .btn:disabled { opacity: .6; }
</style>
</head>
<body class="text-zinc-600">
<main class="max-w-xl mx-auto px-6 py-12">
  <h1 class="text-3xl font-bold text-zinc-800">Apply for a position</h1>
  <p class="mt-2 mb-8">Choose an open role and attach your CV. Our team will contact you about next steps.</p>

  <form id="applyForm" class="card p-6 space-y-4">
    <input id="candidate_name" class="field" placeholder="Full name" required>
    <input id="candidate_email" type="email" class="field" placeholder="Email address" required>
    <select id="jobSelect" class="field" required></select>
    <div>
      <label class="block text-sm font-semibold text-zinc-700 mb-2">Your CV (PDF)</label>
      <input id="resume" type="file" accept=".pdf" class="field" required>
    </div>
    <button id="submitBtn" type="submit" class="btn">Submit application</button>
    <p id="msg" class="text-sm"></p>
  </form>
</main>

<script>
  // ====== SETTINGS: replace with your n8n URL (use /webhook-test while testing, /webhook when active) ======
  const BASE_URL = "http://localhost:5678/webhook";
  const APPLY_URL = BASE_URL + "/resume";
  const JOBS_URL  = BASE_URL + "/jobs";
  // ==========================================================================================================

  const $ = (id) => document.getElementById(id);
  function say(text, ok) { $("msg").textContent = text; $("msg").className = "text-sm " + (ok ? "text-emerald-600" : "text-rose-500"); }

  // Load open jobs into the dropdown
  async function loadJobs() {
    let jobs = [];
    try {
      const data = await (await fetch(JOBS_URL)).json();
      jobs = (Array.isArray(data) ? data : [data]).filter(j => j && j.id);
    } catch (e) {}
    if (!jobs.length) {
      // Sample positions, shown only when the jobs list is empty or n8n is unreachable
      jobs = [
        { id: 1, job_title: "Senior Full-Stack Engineer", location: "Hybrid" },
        { id: 2, job_title: "Frontend Developer", location: "Remote" },
        { id: 3, job_title: "Data Analyst", location: "Onsite" }
      ];
      say("Showing sample positions: the open jobs list is empty or n8n is unreachable.", false);
    }
    $("jobSelect").innerHTML = jobs.length
      ? '<option value="">Select a position</option>' + jobs.map(j => `<option value="${j.id}">${j.job_title}${j.location ? " (" + j.location + ")" : ""}</option>`).join("")
      : '<option value="">No open positions right now</option>';
  }

  // Send name, email, job and CV to n8n
  $("applyForm").onsubmit = async (e) => {
    e.preventDefault();
    if (!$("jobSelect").value) return say("Please select a position.", false);
    const fd = new FormData();
    fd.append("candidate_name", $("candidate_name").value);
    fd.append("candidate_email", $("candidate_email").value);
    fd.append("job_id", $("jobSelect").value);
    fd.append("resume", $("resume").files[0]);
    $("submitBtn").disabled = true;
    say("Sending your application...", true);
    try {
      const res = await fetch(APPLY_URL, { method: "POST", body: fd });
      if (!res.ok) throw new Error("n8n returned " + res.status);
      say("Application received. Thank you!", true);
      $("applyForm").reset();
    } catch (err) { say("Could not send your application: " + err.message, false); }
    $("submitBtn").disabled = false;
  };

  loadJobs();
</script>
</body>
</html>
